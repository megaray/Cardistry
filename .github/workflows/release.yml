name: Release

# Sur chaque tag de version (v1.0.0, v1.2.3…) : tests, puis l'app autonome (Java embarqué) construite
# sur les trois OS, publiée dans une GitHub Release.
# Titre de la release : le message du tag annoté (ex. git tag -a v1.0.0 -m "Alpha"), sinon
# « Cardistry <version> ». Pré-version si le titre contient Alpha/Beta/RC ou si le tag a un suffixe (-rc1).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: Paquets (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Version (tag v1.2.3 ou v1.2.3-rc1 → 1.2.3)
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=${version%%-*}" >> "$GITHUB_ENV"

      - name: Outils Linux (rpm)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - name: WiX Toolset 3 (Windows, pour le .msi)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset v3*" | Select-Object -First 1
            "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Tests
        shell: bash
        run: ./gradlew test --console=plain

      - name: Paquets
        shell: bash
        run: ./gradlew jpackage -PappVersion="$VERSION" --console=plain

      - name: Noms des fichiers
        shell: bash
        run: |
          cd build/jpackage/out
          for f in *.dmg; do [ -e "$f" ] && mv "$f" "Cardistry-$VERSION-macos-arm64.dmg"; done
          for f in *.msi; do [ -e "$f" ] && mv "$f" "Cardistry-$VERSION-windows-x64.msi"; done
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: paquets-${{ matrix.os }}
          if-no-files-found: error
          path: |
            build/jpackage/out/*.dmg
            build/jpackage/out/*.msi
            build/jpackage/out/*.zip
            build/jpackage/out/*.deb
            build/jpackage/out/*.rpm

  release:
    name: GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: paquets
          merge-multiple: true

      - name: Publier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          subject="$(git tag -l --format='%(contents:subject)' "$tag")"
          if [ "$(git cat-file -t "$tag")" = "tag" ] && [ -n "$subject" ]; then
            title="$subject"
          else
            title="Cardistry $version"
          fi
          flags=()
          if [[ "$title" =~ [Aa]lpha|[Bb]eta|RC|rc ]] || [[ "$version" == *-* ]]; then
            flags+=(--prerelease)
          fi
          cat > notes.md <<NOTES
          Cardistry $version : app autonome, Java inclus (rien d'autre à installer).

          | OS | Fichier |
          |---|---|
          | macOS (Apple Silicon) | \`Cardistry-${version%%-*}-macos-arm64.dmg\` |
          | Windows | \`Cardistry-${version%%-*}-windows-x64.msi\` (ou le \`.zip\` portable, sans installation) |
          | Linux (Debian, Ubuntu) | \`.deb\` |
          | Linux (Fedora, openSUSE) | \`.rpm\` |

          Les paquets ne sont pas signés : au premier lancement, macOS (Gatekeeper) et Windows (SmartScreen)
          affichent un avertissement. Comment le passer : README, section « Installer l'app ».
          NOTES
          sed -i 's/^          //' notes.md
          ls -la paquets
          gh release create "$tag" paquets/* --title "$title" --notes-file notes.md --verify-tag "${flags[@]}"
